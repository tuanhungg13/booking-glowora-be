version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glowora_app_pro
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_DB: ${MYSQL_DB:-glowora_business}
      REDIS_HOST: redis
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - glowora_network

  mysql:
    image: mysql:8.0
    container_name: glowora_mysql_pro
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gloworadev}
      MYSQL_DATABASE: ${MYSQL_DB:-glowora_business}
      MYSQL_USER: ${MYSQL_USER:-hwglee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gloworadev}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Tune InnoDB cho tải burst nhiều booking cùng lúc (xem báo cáo tối ưu concurrency):
    # - buffer-pool lớn hơn default 128MB để index booking/staff nằm gọn trong RAM
    # - max-connections đủ margin trên connectionLimit=60 của Prisma pool (prisma.service.ts)
    # - lock-wait-timeout hạ từ default 50s để transaction bị chờ lock fail nhanh, nhường
    #   chỗ cho retryTransaction retry thay vì giữ connection/lock lâu dưới tải cao
    command:
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-1G}
      - --innodb-buffer-pool-instances=${MYSQL_INNODB_BUFFER_POOL_INSTANCES:-4}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-200}
      - --innodb-lock-wait-timeout=${MYSQL_INNODB_LOCK_WAIT_TIMEOUT:-8}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-gloworadev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - glowora_network

  redis:
    image: redis:7-alpine
    container_name: glowora_redis_pro
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - glowora_network

volumes:
  mysql_data:
  redis_data:

networks:
  glowora_network:
    driver: bridge
