version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: glowora_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gloworadev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-glowora_business}
      MYSQL_USER: ${MYSQL_USER:-postgres}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gloworadev}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Tune InnoDB cho tải burst nhiều booking cùng lúc (xem báo cáo tối ưu concurrency):
    # - buffer-pool lớn hơn default 128MB để index booking/staff nằm gọn trong RAM
    # - max-connections đủ margin trên connectionLimit=60 của Prisma pool (prisma.service.ts)
    # - lock-wait-timeout hạ từ default 50s để transaction bị chờ lock fail nhanh, nhường
    #   chỗ cho retryTransaction retry thay vì giữ connection/lock lâu dưới tải cao
    command:
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-1G}
      - --innodb-buffer-pool-instances=${MYSQL_INNODB_BUFFER_POOL_INSTANCES:-4}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-200}
      - --innodb-lock-wait-timeout=${MYSQL_INNODB_LOCK_WAIT_TIMEOUT:-8}
    # Ports exposed to localhost only (for IDE, development tools)
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glowora_network

  redis:
    image: redis:7-alpine
    container_name: glowora_redis
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    # Ports exposed to localhost only (for redis-cli, development tools)
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - glowora_network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: glowora_rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-glowora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gloworadev}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Ports exposed to localhost only (for dev, RabbitMQ management UI)
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glowora_network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  glowora_network:
    driver: bridge

