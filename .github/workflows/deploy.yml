name: CI/CD Backend

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  ci:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: 'mysql://user:password@localhost:3306/glowora_business'

      - name: Build application
        run: pnpm build

  cd:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            cd /var/www/booking-business-be

            git fetch origin develop
            git reset --hard origin/develop

            docker compose -f docker-compose.pro.yml up -d --build

            echo "Waiting for app container to become healthy..."

            for i in $(seq 1 15); do
              status=$(docker inspect --format='{{.State.Health.Status}}' glowora_app_pro 2>/dev/null || echo "starting")

              if [ "$status" = "healthy" ]; then
                echo "App is healthy."
                exit 0
              fi

              if [ "$status" = "unhealthy" ]; then
                echo "App is unhealthy. Recent logs:"
                docker logs --tail 100 glowora_app_pro
                exit 1
              fi

              sleep 5
            done

            echo "Timed out waiting for app to become healthy."
            docker logs --tail 100 glowora_app_pro
            exit 1