name: CI/CD Backend

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  ci:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/glowora_business

      - name: Build application
        run: pnpm build

  cd:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Test SSH connection
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}

        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

          echo "=== Test TCP port 22 ==="
          timeout 15 bash -c "</dev/tcp/$VPS_HOST/22"

          echo "=== Scan host key ==="
          ssh-keyscan -T 15 "$VPS_HOST" >> ~/.ssh/known_hosts || {
            echo "!!! ssh-keyscan failed, retrying verbose for diagnostics !!!"
            ssh-keyscan -T 15 -v "$VPS_HOST"
            exit 1
          }

          echo "=== Test SSH ==="
          ssh -vvv \
            -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USERNAME@$VPS_HOST" \
            "echo SSH_SUCCESS"

      - name: Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}

        run: |
          ssh \
            -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USERNAME@$VPS_HOST" << 'EOF'

            set -e

            cd /var/www/booking-business-be

            git fetch origin develop
            git reset --hard origin/develop

            docker compose -f docker-compose.pro.yml up -d --build

            echo "Deploy successful"

          EOF