name: CI/CD Backend

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  ci:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/glowora_business

      - name: Build application
        run: pnpm build

  cd:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/vps_key
          chmod 644 ~/.ssh/known_hosts

      - name: Debug network
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}

        run: |
          set -e

          echo "=== GitHub Actions public IP ==="
          curl -4 ifconfig.me
          echo

          echo "=== SSH Target ==="
          echo "Username: $VPS_USERNAME"
          echo "Host length: ${#VPS_HOST}"

          echo "=== DNS Resolution ==="
          getent hosts "$VPS_HOST" || true

          echo "=== Test TCP port 22 ==="
          timeout 15 bash -c "</dev/tcp/$VPS_HOST/22"

          echo "TCP port 22 is reachable"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}

        run: |
          set -e

          ssh \
            -vvv \
            -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USERNAME@$VPS_HOST" << 'EOF'

            set -e

            echo "SSH connection successful"

            cd /var/www/booking-business-be

            echo "Fetching latest code..."
            git fetch origin develop

            echo "Resetting to origin/develop..."
            git reset --hard origin/develop

            echo "Building and restarting Docker containers..."
            docker compose -f docker-compose.pro.yml up -d --build

            echo "Deploy successful"

          EOF